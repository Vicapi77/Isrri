        // --- IMÁGENES: compresión en navegador y guardado como base64 directo en Firestore ---
        const MAX_PHOTOS = 5;
        const UNIT_STATUSES = [
            { id: 'Pendiente', color: 'bg-slate-100 text-slate-600 border-slate-300', bar: 'bg-slate-400' },

        // --- CATÁLOGO DE CAUSAS DE INCIDENCIA (clave del contador -> etiqueta) ---

            { group: 'No imputable', key: 'causeNoImpWeather', label: 'Clima' }, { group: 'No imputable', key: 'causeNoImpCrashNoResp', label: 'Percance S/R' },
            { group: 'No imputable', key: 'causeNoImpTrain', label: 'Tren' }, { group: 'No imputable', key: 'causeNoImpVandalism', label: 'Vandalismo' },
            { group: 'No imputable', key: 'causeNoImpOvercapacity', label: 'Sobreaforo' }, { group: 'No imputable', key: 'causeNoImpPublicEvent', label: 'Evento Publico' },
            { group: 'No imputable', key: 'causeNoImpProtest', label: 'Manifestación' }, { group: 'No imputable', key: 'causeNoImpPublicWork', label: 'Obra Publica' },

        const ddmmyyToDate = (s) => { if (!s) return null; const [d, m, y] = s.split('/'); return new Date(2000 + parseInt(y), parseInt(m) - 1, parseInt(d)); };

        const statusInfo = (s) => UNIT_STATUSES.find(x => x.id === s) || UNIT_STATUSES[0];

        const compressImage = (file, maxSize, quality) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
                    const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
                    const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
                    let q = quality; let out = canvas.toDataURL('image/jpeg', q);
                    while (out.length > 850000 && q > 0.3) { q -= 0.1; out = canvas.toDataURL('image/jpeg', q); } // límite doc Firestore 1MB
                    resolve(out);
                };
                img.onerror = reject; img.src = e.target.result;
            };
            reader.onerror = reject; reader.readAsDataURL(file);
        });

        // --- FIREBASE SETUP ---

        // --- DATOS DEMO ---
        const DEMO_INCIDENTS = [];
        const DEMO_COMPLAINTS = [];

        const PLANTS = ['Todas', 'Isrri'];
        const { weeksDef: WEEKS_DEF } = (() => {
            const weeks = {}; let currentDate = new Date(2025, 10, 17); // Lunes 17 Nov 2025
            let weekCounter = 47; let yearForWeek = 2025; let dayCount = 0; let currentWeekKey = '';
            while (currentDate <= new Date(2026, 11, 31)) {
                const dateStr = `${currentDate.getDate().toString().padStart(2,'0')}/${(currentDate.getMonth()+1).toString().padStart(2,'0')}/${currentDate.getFullYear().toString().slice(-2)}`;
                if (dayCount % 7 === 0) {
                    const k = `S${weekCounter}-${yearForWeek.toString().slice(-2)}`;
                    weeks[k] = { id: k, label: `Sem ${weekCounter}`, fullLabel: `Semana ${weekCounter} '${yearForWeek.toString().slice(-2)}`, dates: [] };
                    currentWeekKey = k; weekCounter++; if (weekCounter > 52) { weekCounter = 1; yearForWeek++; }
                }
                weeks[currentWeekKey].dates.push(dateStr); dayCount++; currentDate.setDate(currentDate.getDate() + 1);
            }
            return { weeksDef: weeks };
        })();

        // --- DEFINICIÓN DE MESES ---
        const MONTHS_DEF = (() => {
            const months = {};
            const end = new Date(2026, 11, 31);
            let cur = new Date(2025, 10, 1);
            const monthNames = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
            while (cur <= end) {
                const key = `M${(cur.getMonth()+1).toString().padStart(2,'0')}-${cur.getFullYear().toString().slice(-2)}`;
                const label = `${monthNames[cur.getMonth()]} '${cur.getFullYear().toString().slice(-2)}`;
                const dates = [];
                const daysInMonth = new Date(cur.getFullYear(), cur.getMonth()+1, 0).getDate();
                for (let d = 1; d <= daysInMonth; d++) {
                    dates.push(`${d.toString().padStart(2,'0')}/${(cur.getMonth()+1).toString().padStart(2,'0')}/${cur.getFullYear().toString().slice(-2)}`);
                }
                const weekKeys = Object.keys(WEEKS_DEF).filter(wk => {
                    const firstDate = WEEKS_DEF[wk].dates[0];
                    if (!firstDate) return false;
                    const [dd, mm, yy] = firstDate.split('/');
                    return parseInt(mm) === cur.getMonth()+1 && parseInt('20'+yy) === cur.getFullYear();
                });
                months[key] = { id: key, label, dates, weekKeys };
                cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
            }
            return months;
        })();

        // --- CHART COMPONENTS ---
        const TrendChart = ({ data, dataKey, color, title, suffix = '' }) => {
            if (!data || data.length === 0) return null;
            const values = data.map(d => d[dataKey]); const min = Math.min(...values); const max = Math.max(...values);
            const paddingY = (max - min) * 0.2 || 1; const domainMin = Math.max(0, min - paddingY); const domainMax = max + paddingY; const range = domainMax - domainMin || 1;
            const width = 250; const height = 100; const margin = 15;
            const points = data.map((d, i) => `${margin + (i / (data.length - 1)) * (width - 2 * margin)},${height - margin - ((d[dataKey] - domainMin) / range) * (height - 2 * margin)}`).join(" ");
            const dots = data.map((d, i) => ({ x: margin + (i / (data.length - 1)) * (width - 2 * margin), y: height - margin - ((d[dataKey] - domainMin) / range) * (height - 2 * margin), val: d[dataKey], label: d.label }));
            return (
                <div className="flex flex-col items-center w-full bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <h5 className="text-sm font-bold text-slate-600 mb-3 uppercase tracking-wider">{title}</h5>
                    <div className="relative w-full flex justify-center">
                        <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`} className="overflow-visible">
                            <polyline points={points} fill="none" stroke={color} strokeWidth="3" />
                            {dots.map((dot, i) => (<g key={i}><circle cx={dot.x} cy={dot.y} r="4" fill="white" stroke={color} strokeWidth="2" /><text x={dot.x} y={dot.y - 12} textAnchor="middle" fontSize="11" fill="#475569" fontWeight="bold">{dot.val}{suffix}</text><text x={dot.x} y={height + 15} textAnchor="middle" fontSize="10" fill="#94a3b8">{dot.label}</text></g>))}
                        </svg>
                    </div>
                </div>
            );
        };

        const SimpleDonutChart = ({ data, total, title }) => {
            if (total === 0) return <div className="h-40 flex items-center justify-center text-slate-300 text-xs">Sin datos</div>;
            let acc = 0; const r = 40; const c = 50;
            const segs = data.map(d => {
                const p = d.val / total; if(p===0) return null;
                if(p===1) return { d: `M 50 50 m -40, 0 a 40,40 0 1,0 80,0 a 40,40 0 1,0 -80,0`, color: d.color, label: d.label, val: d.val, percent: 100 };
                const a1 = acc * 360; const a2 = (acc + p) * 360; acc += p;
                const x1 = c + r * Math.cos(Math.PI * a1 / 180); const y1 = c + r * Math.sin(Math.PI * a1 / 180);
                const x2 = c + r * Math.cos(Math.PI * a2 / 180); const y2 = c + r * Math.sin(Math.PI * a2 / 180);
                return { d: `M ${c} ${c} L ${x1} ${y1} A ${r} ${r} 0 ${p > 0.5 ? 1 : 0} 1 ${x2} ${y2} Z`, color: d.color, label: d.label, val: d.val, percent: (p*100).toFixed(0) };
            }).filter(Boolean);
            return (
                <div className="flex flex-col items-center">
                    <h4 className="text-xs font-bold text-slate-500 mb-2 uppercase">{title}</h4>
                    <div className="relative w-32 h-32"><svg viewBox="0 0 100 100" className="transform -rotate-90 w-full h-full">{segs.map((s, i) => <path key={i} d={s.d} fill={s.color} stroke="white" strokeWidth="1" />)}<circle cx="50" cy="50" r="25" fill="white" /></svg><div className="absolute inset-0 flex items-center justify-center flex-col"><span className="text-xl font-bold text-slate-700">{total}</span></div></div>
                    <div className="w-full mt-4 space-y-1 max-h-40 overflow-y-auto pr-1">
                        {segs.map((s, i) => s.val > 0 && (<div key={i} className="flex justify-between text-xs items-center"><div className="flex items-center gap-2"><span className="w-2 h-2 rounded-full min-w-[8px]" style={{backgroundColor: s.color}}></span><span className="text-slate-600 truncate">{s.label}</span></div><span className="font-bold text-slate-800 ml-2">{s.val} ({s.percent}%)</span></div>))}
                    </div>
                </div>
            );
        };

        const SimpleBarChart = ({ data, dataKeys, colors, height = 150 }) => {
            const max = Math.max(...data.flatMap(d => dataKeys.map(k => d[k])), 1);
            return (
                <div className="w-full flex items-end justify-between gap-2" style={{ height: `${height}px` }}>
                    {data.map((item, i) => (
                        <div key={i} className="flex-1 flex flex-col items-center h-full justify-end group">

                                    causeNoImpTraffic: parseInt(data.causeNoImpTraffic)||0, causeNoImpWeather: parseInt(data.causeNoImpWeather)||0, causeNoImpClosed: parseInt(data.causeNoImpClosed)||0, causeNoImpOther: parseInt(data.causeNoImpOther)||0,

                                };

                                if (editingItem) {
                                    db.collection("incidents").doc(editingItem.id).update(payload);
                                    showNotification('success', 'Registro Actualizado');

                                    showNotification('success', 'Guardado');

                                setIsModalOpen(false);

                            dailyKpis={dailyKpis}
                            onSaveKpi={async (data) => {
                                const [y, m, d] = data.date.split('-');
                                const id = `${data.plant}_${data.date}`;
                                const payload = {
                                    date: `${d}/${m}/${y.slice(-2)}`, plant: data.plant,
                                    serviceLevel: isNaN(parseFloat(data.kpiServiceLevel)) ? 100 : parseFloat(data.kpiServiceLevel),
                                    safetyScore: isNaN(parseFloat(data.kpiSafetyScore)) ? 100 : parseFloat(data.kpiSafetyScore),
                                    onTimeStarts: isNaN(parseFloat(data.kpiOnTimeStarts)) ? 100 : parseFloat(data.kpiOnTimeStarts),

                                if (editingItem && editingItem.id && editingItem.id !== id && modalTab === 'kpi') await db.collection("daily_kpis").doc(editingItem.id).delete();

                detail: initialData?.detail || '',

            const toKey = (iso) => { const [y, m, d] = iso.split('-'); return `${d}/${m}/${y.slice(-2)}`; };
            const existingKpi = tab === 'kpi' ? dailyKpis.find(k => k.date === toKey(formData.date) && k.plant === formData.plant) : null;

            }, [tab, existingKpi && existingKpi.id]);

                e.preventDefault();
                if (tab === 'kpi') return onSaveKpi(formData);

                                        <div><label className="text-xs font-bold text-amber-400">I. Tarde s/Afect.</label><input type="number" name="lateStartsNoAff" value={formData.lateStartsNoAff} onChange={handleChange} className="w-full border rounded p-1 text-sm"/></div>
                                        <div><label className="text-xs font-bold text-slate-500">Percances</label><input type="number" name="accidents" value={formData.accidents} onChange={handleChange} className="w-full border rounded p-1 text-sm"/></div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
                                        {/* IMPUTABLES */}
                                        <div className="border-rose-100 border p-3 bg-rose-50/50 rounded"><h4 className="text-sm font-bold text-rose-600 mb-3 border-b border-rose-200 pb-1">Imputables</h4>
                                            <div className="grid grid-cols-2 gap-x-4 gap-y-2">
                                                <div className="flex justify-between items-center"><label className="text-xs">Op. Dormido</label><input type="number" name="causeImpSleep" value={formData.causeImpSleep} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Siniestro</label><input type="number" name="causeImpAccident" value={formData.causeImpAccident} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Desvío Ruta</label><input type="number" name="causeImpRoute" value={formData.causeImpRoute} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Falla Mec.</label><input type="number" name="causeImpMech" value={formData.causeImpMech} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Supervisor</label><input type="number" name="causeImpSupervisor" value={formData.causeImpSupervisor} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Actitud de Op</label><input type="number" name="causeImpAttitude" value={formData.causeImpAttitude} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Mal Manejo</label><input type="number" name="causeImpDriving" value={formData.causeImpDriving} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Ponchadura</label><input type="number" name="causeImpFlatTire" value={formData.causeImpFlatTire} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Alcoholemia</label><input type="number" name="causeImpAlcohol" value={formData.causeImpAlcohol} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Diesel</label><input type="number" name="causeImpDiesel" value={formData.causeImpDiesel} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Tema de Op.</label><input type="number" name="causeImpOpTheme" value={formData.causeImpOpTheme} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                            </div>
                                        </div>
                                        {/* NO IMPUTABLES */}
                                        <div className="border-slate-200 border p-3 bg-slate-50 rounded"><h4 className="text-sm font-bold text-slate-500 mb-3 border-b border-slate-200 pb-1">No Imputables</h4>
                                            <div className="grid grid-cols-2 gap-x-4 gap-y-2">
                                                <div className="flex justify-between items-center"><label className="text-xs">Tráfico</label><input type="number" name="causeNoImpTraffic" value={formData.causeNoImpTraffic} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Calle Cerrada</label><input type="number" name="causeNoImpClosed" value={formData.causeNoImpClosed} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Clima</label><input type="number" name="causeNoImpWeather" value={formData.causeNoImpWeather} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Percance S/R</label><input type="number" name="causeNoImpCrashNoResp" value={formData.causeNoImpCrashNoResp} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Tren</label><input type="number" name="causeNoImpTrain" value={formData.causeNoImpTrain} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Vandalismo</label><input type="number" name="causeNoImpVandalism" value={formData.causeNoImpVandalism} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Sobreaforo</label><input type="number" name="causeNoImpOvercapacity" value={formData.causeNoImpOvercapacity} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Evento Publico</label><input type="number" name="causeNoImpPublicEvent" value={formData.causeNoImpPublicEvent} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Manifestación</label><input type="number" name="causeNoImpProtest" value={formData.causeNoImpProtest} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Obra Publica</label><input type="number" name="causeNoImpPublicWork" value={formData.causeNoImpPublicWork} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Acc. Terceros</label><input type="number" name="causeNoImpThirdPartyCrash" value={formData.causeNoImpThirdPartyCrash} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                                <div className="flex justify-between items-center"><label className="text-xs">Otros</label><input type="number" name="causeNoImpOther" value={formData.causeNoImpOther} onChange={handleChange} className="w-12 border rounded text-center text-sm"/></div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* RUTAS AFECTADAS */}
                                    <div className="border border-blue-100 bg-blue-50/40 rounded p-3 mt-2">
                                        <div className="flex justify-between items-center mb-2 border-b border-blue-200 pb-1">
                                            <h4 className="text-sm font-bold text-blue-700">Rutas afectadas <span className="text-xs font-normal text-slate-500">— una fila por incidencia</span></h4>
                                            <button type="button" onClick={addRoute} className="text-xs bg-blue-600 hover:bg-blue-700 text-white px-2 py-1 rounded flex items-center gap-1"><Icons.Plus /> Agregar ruta</button>
                                        </div>
                                        {formData.affectedRoutes.length === 0 ? <div className="text-xs text-slate-400 text-center py-3">Sin rutas capturadas. Usa "Agregar ruta" para registrar cada incidencia con su ruta y usuarios a bordo.</div> : (
                                            <div className="space-y-2">
                                                <div className="hidden md:grid grid-cols-12 gap-2 text-[11px] font-bold text-slate-500 px-1"><div className="col-span-3">Ruta</div><div className="col-span-2 text-center">Usuarios a bordo</div><div className="col-span-3">Causa</div><div className="col-span-3">Nota</div><div></div></div>
                                                {formData.affectedRoutes.map((r, i) => (
                                                    <div key={i} className="grid grid-cols-12 gap-2 items-center bg-white border rounded p-2">
                                                        <input value={r.route} onChange={e => setRoute(i, 'route', e.target.value)} required placeholder="Ej. R-12" className="col-span-6 md:col-span-3 border rounded p-1 text-sm font-bold" />
                                                        <input type="number" min="0" value={r.users} onChange={e => setRoute(i, 'users', e.target.value)} placeholder="0" className="col-span-6 md:col-span-2 border rounded p-1 text-sm text-center font-bold text-blue-700" />
                                                        <select value={r.cause} onChange={e => setRoute(i, 'cause', e.target.value)} className="col-span-12 md:col-span-3 border rounded p-1 text-xs">
                                                            {['Imputable', 'No imputable', 'Inicio tarde', 'Percance'].map(g => <optgroup key={g} label={g}>{INCIDENT_CAUSES.filter(c => c.group === g).map(c => <option key={c.key} value={c.key}>{c.label}</option>)}</optgroup>)}
                                                        </select>
                                                        <input value={r.note || ''} onChange={e => setRoute(i, 'note', e.target.value)} placeholder="Detalle (opcional)" className="col-span-10 md:col-span-3 border rounded p-1 text-xs" />
                                                        <button type="button" onClick={() => delRoute(i)} className="col-span-2 md:col-span-1 text-red-400 hover:text-red-600 flex justify-center" title="Quitar"><span className="scale-75"><Icons.Trash2 /></span></button>
                                                    </div>
                                                ))}
                                                {(() => {
                                                    const counts = {}; formData.affectedRoutes.forEach(r => { counts[r.cause] = (counts[r.cause] || 0) + 1; });
                                                    const diff = Object.entries(counts).filter(([k, n]) => (parseInt(formData[k]) || 0) < n);
                                                    return diff.length > 0 && (
                                                        <div className="text-xs bg-amber-50 border border-amber-200 text-amber-700 rounded p-2 flex justify-between items-center gap-2 flex-wrap">
                                                            <span>Hay más rutas que el contador en: {diff.map(([k]) => causeByKey(k)?.label).join(', ')}.</span>
                                                            <button type="button" onClick={() => setFormData(p => { const n = { ...p }; diff.forEach(([k, v]) => { n[k] = v; }); return n; })} className="bg-amber-600 text-white px-2 py-1 rounded font-bold">Ajustar contadores</button>
                                                        </div>
                                                    );
                                                })()}
                                            </div>
                                        )}
                                    </div>
                                </>
                            ) : (
                                <>
                                    <input type="text" name="route" placeholder="Ruta" value={formData.route} onChange={handleChange} className="w-full border rounded p-2 text-sm"/>
                                    <div className="grid grid-cols-2 gap-4">
                                        <select name="issue" value={formData.issue} onChange={handleChange} className="w-full border rounded p-2 text-sm">
                                            <option>Actitud</option>
                                            <option>Retraso</option>
                                            <option>Falla de unidad</option>
                                            <option>Manejo</option>
                                            <option>Desvío de ruta</option>
                                        </select>
                                        <select name="source" value={formData.source} onChange={handleChange} className="w-full border rounded p-2 text-sm"><option>Laborales</option><option>Sindicato</option></select>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 mb-1 block">¿Es reincidente?</label>
                                        <div className="flex gap-2">
                                            {['No', 'Sí'].map(opt => (
                                                <button type="button" key={opt} onClick={() => setFormData(p => ({ ...p, recurrent: opt }))}
                                                    className={`flex-1 py-2 rounded border text-sm font-bold ${formData.recurrent === opt ? (opt === 'Sí' ? 'bg-red-600 text-white border-red-600' : 'bg-slate-800 text-white border-slate-800') : 'bg-white text-slate-500 hover:bg-slate-50'}`}>{opt}</button>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div className="md:col-span-2"><label className="text-xs font-bold text-slate-500">Acción Tomada</label><input type="text" name="action" placeholder="Ej. Acta administrativa, Compromiso..." value={formData.action} onChange={handleChange} className="w-full border rounded p-2 text-sm"/></div>
                                        <div><label className="text-xs font-bold text-slate-500">Fecha de cierre <span className="font-normal text-slate-400">(vacío = abierta)</span></label><div className="flex gap-1"><input type="date" name="closeDate" min={formData.date} value={formData.closeDate} onChange={handleChange} className="w-full border rounded p-2 text-sm"/>{formData.closeDate && <button type="button" onClick={() => setFormData(p => ({ ...p, closeDate: '' }))} className="px-2 text-slate-400 hover:text-red-500" title="Quitar"><Icons.X /></button>}</div></div>
                                    </div>
                                    <textarea name="detail" placeholder="Detalle de la queja..." rows="3" value={formData.detail} onChange={handleChange} className="w-full border rounded p-2 text-sm"></textarea>
                                </>
                            )}
                        </form></div>
                        <div className="p-4 border-t bg-slate-50 flex justify-between">
                            {!initialData ? <button type="button" onClick={onSeed} className="text-xs text-slate-400 flex gap-1 items-center"><Icons.CloudUpload/> Demo</button> : <div></div>}
                            <div className="flex gap-2"><button onClick={close} className="px-4 py-2 rounded text-sm hover:bg-slate-200">Cancelar</button><button type="submit" form="f" className="px-4 py-2 rounded text-sm bg-rose-600 text-white hover:bg-rose-700 shadow">{initialData ? 'Actualizar' : 'Guardar'}</button></div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MODAL UNIDAD EN REPARACIÓN ---
        const UnitModal = ({ item, readOnly, openSlot, close, notify }) => {
            const { useRef } = React;
            const isNew = !item;
            const [form, setForm] = useState({
                unit: item?.unit || '', issue: item?.issue || '', status: item?.status || 'Pendiente',
                progress: item?.progress ?? 0, entryDate: item?.entryDate || new Date().toISOString().split('T')[0],
                etaDate: item?.etaDate || '', notes: item?.notes || ''
            });
            // photos[i] = { full, thumb, dirty }
            const [photos, setPhotos] = useState(Array.from({ length: MAX_PHOTOS }, (_, i) => ({ full: null, thumb: item?.thumbs?.[i] || null, dirty: false })));
            const [loadingPhotos, setLoadingPhotos] = useState(!!item);
            const [busySlot, setBusySlot] = useState(null);
            const [menuSlot, setMenuSlot] = useState(null);
            const [viewSlot, setViewSlot] = useState(null);
            const [saving, setSaving] = useState(false);
            const galleryRef = useRef(null); const cameraRef = useRef(null); const targetSlot = useRef(null);

            useEffect(() => {
                if (!item) return;
                Promise.all(Array.from({ length: MAX_PHOTOS }, (_, i) => db.collection("repair_unit_photos").doc(`${item.id}_${i}`).get()))
                    .then(snaps => {
                        setPhotos(prev => prev.map((p, i) => snaps[i].exists ? { ...p, full: snaps[i].data().data } : p));
                        setLoadingPhotos(false);
                        if (openSlot !== undefined && snaps[openSlot]?.exists) setViewSlot(openSlot);
                    }).catch(() => setLoadingPhotos(false));
            }, []);

            const ch = (e) => setForm(p => ({ ...p, [e.target.name]: e.target.value }));
            const setStatus = (s) => setForm(p => ({ ...p, status: s, progress: s === 'Terminada' ? 100 : p.progress }));

            const pick = (slot, mode) => { targetSlot.current = slot; setMenuSlot(null); (mode === 'camera' ? cameraRef : galleryRef).current.click(); };
            const onFile = async (e) => {
                const file = e.target.files && e.target.files[0]; e.target.value = '';
                const slot = targetSlot.current; if (!file || slot === null) return;
                setBusySlot(slot);
                try {
                    const full = await compressImage(file, 1280, 0.7);
                    const thumb = await compressImage(file, 220, 0.6);
                    setPhotos(prev => prev.map((p, i) => i === slot ? { full, thumb, dirty: true } : p));
                } catch (err) { notify('error', 'No se pudo procesar la imagen'); }
                setBusySlot(null);
            };
            const removePhoto = (slot) => { if (!confirm('¿Borrar esta imagen?')) return; setPhotos(prev => prev.map((p, i) => i === slot ? { full: null, thumb: null, dirty: true } : p)); setMenuSlot(null); };

            const save = async () => {
                if (!form.unit.trim()) { notify('error', 'Captura el número de unidad'); return; }
                setSaving(true);
                try {
                    const ref = isNew ? db.collection("repair_units").doc() : db.collection("repair_units").doc(item.id);
                    const payload = { ...form, unit: form.unit.trim(), progress: Math.max(0, Math.min(100, parseInt(form.progress) || 0)), thumbs: photos.map(p => p.thumb || null), updatedAt: Date.now() };
                    if (isNew) payload.createdAt = Date.now();
                    await ref.set(payload, { merge: true });
                    await Promise.all(photos.map((p, i) => {
                        if (!p.dirty) return null;
                        const pRef = db.collection("repair_unit_photos").doc(`${ref.id}_${i}`);
                        return p.full ? pRef.set({ unitId: ref.id, slot: i, data: p.full, updatedAt: Date.now() }) : pRef.delete();
                    }));
                    notify('success', isNew ? 'Unidad agregada' : 'Unidad actualizada');
                    close();
                } catch (err) { console.error(err); notify('error', 'Error al guardar: ' + err.message); setSaving(false); }
            };

            const filled = photos.filter(p => p.thumb || p.full).length;
            const prog = Math.max(0, Math.min(100, parseInt(form.progress) || 0));
            const st = statusInfo(form.status);

            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-3xl flex flex-col max-h-[95vh] fade-in">
                        <div className="bg-slate-900 p-4 flex justify-between text-white rounded-t-2xl">
                            <h2 className="font-bold flex gap-2 items-center"><Icons.Wrench /> {readOnly ? `Unidad ${form.unit}` : isNew ? 'Agregar Unidad' : `Editar Unidad ${item.unit}`}</h2>
                            <button onClick={close}><Icons.X /></button>
                        </div>
                        <div className="p-6 overflow-y-auto space-y-5">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div><label className="text-xs font-bold text-slate-500">No. Unidad</label><input name="unit" value={form.unit} onChange={ch} disabled={readOnly} className="w-full border rounded p-2 text-sm font-bold disabled:bg-slate-50" placeholder="Ej. 1045" /></div>
                                <div><label className="text-xs font-bold text-slate-500">Fecha ingreso</label><input type="date" name="entryDate" value={form.entryDate} onChange={ch} disabled={readOnly} className="w-full border rounded p-2 text-sm disabled:bg-slate-50" /></div>
                                <div><label className="text-xs font-bold text-slate-500">Fecha estimada salida</label><input type="date" name="etaDate" value={form.etaDate} onChange={ch} disabled={readOnly} className="w-full border rounded p-2 text-sm disabled:bg-slate-50" /></div>
                            </div>
                            <div><label className="text-xs font-bold text-slate-500">Falla / Motivo de reparación</label><input name="issue" value={form.issue} onChange={ch} disabled={readOnly} className="w-full border rounded p-2 text-sm disabled:bg-slate-50" placeholder="Ej. Falla en sistema de frenos" /></div>

                            <div>
                                <label className="text-xs font-bold text-slate-500 mb-1 block">Estatus</label>
                                <div className="flex flex-wrap gap-2">
                                    {UNIT_STATUSES.map(s => (
                                        <button type="button" key={s.id} disabled={readOnly} onClick={() => setStatus(s.id)}
                                            className={`text-xs border px-3 py-1.5 rounded-full font-bold ${form.status === s.id ? s.color + ' ring-2 ring-offset-1 ring-slate-400' : 'bg-white text-slate-400 border-slate-200'} ${readOnly ? 'cursor-default' : ''}`}>{s.id}</button>
                                    ))}
                                </div>
                            </div>

                            <div>
                                <div className="flex justify-between text-xs mb-1"><label className="font-bold text-slate-500">Avance de reparación</label><span className="font-bold text-slate-700">{prog}%</span></div>
                                {readOnly
                                    ? <div className="w-full h-3 bg-slate-100 rounded-full overflow-hidden"><div className={`h-full ${st.bar}`} style={{ width: `${prog}%` }}></div></div>
                                    : <input type="range" min="0" max="100" step="5" name="progress" value={prog} onChange={ch} className="w-full accent-rose-600" />}
                            </div>

                            <div><label className="text-xs font-bold text-slate-500">Notas / Detalle del avance</label><textarea name="notes" rows="3" value={form.notes} onChange={ch} disabled={readOnly} className="w-full border rounded p-2 text-sm disabled:bg-slate-50" placeholder="Ej. Se cambiaron balatas, pendiente revisión de rotores..."></textarea></div>

                            <div>
                                <div className="flex justify-between items-center mb-2"><label className="text-xs font-bold text-slate-500">Imágenes</label><span className="text-xs text-slate-400">{filled}/{MAX_PHOTOS} {loadingPhotos && <span className="loader ml-1" style={{ width: 12, height: 12 }}></span>}</span></div>
                                <div className="grid grid-cols-5 gap-2">
                                    {photos.map((p, i) => {
                                        const src = p.thumb || p.full;
                                        return (
                                            <div key={i} className="relative">
                                                <button type="button"
                                                    onClick={() => { if (busySlot !== null) return; if (src) { readOnly ? setViewSlot(i) : setMenuSlot(menuSlot === i ? null : i); } else if (!readOnly) setMenuSlot(menuSlot === i ? null : i); }}
                                                    className={`w-full aspect-square rounded-lg border-2 overflow-hidden flex items-center justify-center ${src ? 'border-slate-200' : 'border-dashed border-slate-300 bg-slate-50 text-slate-400'} ${readOnly && !src ? 'cursor-default' : 'hover:border-rose-400'}`}>
                                                    {busySlot === i ? <span className="loader"></span> : src ? <img src={src} className="w-full h-full object-cover" /> : <div className="flex flex-col items-center text-[10px]">{readOnly ? <Icons.Image /> : <><Icons.Plus /><span>Foto {i + 1}</span></>}</div>}
                                                </button>
                                                {menuSlot === i && !readOnly && (
                                                    <div className="absolute z-20 top-full mt-1 left-1/2 -translate-x-1/2 bg-white border rounded-lg shadow-xl text-xs w-36 overflow-hidden fade-in">
                                                        {src && <button type="button" onClick={() => { setViewSlot(i); setMenuSlot(null); }} className="w-full px-3 py-2 text-left hover:bg-slate-50 flex items-center gap-2"><Icons.Eye /> Ver</button>}
                                                        <button type="button" onClick={() => pick(i, 'gallery')} className="w-full px-3 py-2 text-left hover:bg-slate-50 flex items-center gap-2"><Icons.Image /> {src ? 'Cambiar (galería)' : 'Galería'}</button>
                                                        <button type="button" onClick={() => pick(i, 'camera')} className="w-full px-3 py-2 text-left hover:bg-slate-50 flex items-center gap-2"><Icons.Camera /> {src ? 'Cambiar (cámara)' : 'Tomar foto'}</button>
                                                        {src && <button type="button" onClick={() => removePhoto(i)} className="w-full px-3 py-2 text-left hover:bg-red-50 text-red-600 flex items-center gap-2 border-t"><span className="scale-75"><Icons.Trash2 /></span> Borrar</button>}
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                                <input ref={galleryRef} type="file" accept="image/*" className="hidden" onChange={onFile} />
                                <input ref={cameraRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={onFile} />
                            </div>
                        </div>
                        <div className="p-4 border-t bg-slate-50 flex justify-end gap-2 rounded-b-2xl">
                            <button onClick={close} className="px-4 py-2 rounded text-sm hover:bg-slate-200">{readOnly ? 'Cerrar' : 'Cancelar'}</button>
                            {!readOnly && <button onClick={save} disabled={saving || busySlot !== null} className="px-4 py-2 rounded text-sm bg-rose-600 text-white hover:bg-rose-700 shadow disabled:opacity-50 flex items-center gap-2">{saving && <span className="loader" style={{ width: 14, height: 14, borderTopColor: '#fff' }}></span>}{isNew ? 'Guardar' : 'Actualizar'}</button>}
                        </div>
                    </div>

                    {viewSlot !== null && (
                        <div className="fixed inset-0 bg-black/90 z-[60] flex flex-col items-center justify-center p-4" onClick={() => setViewSlot(null)}>
                            <button className="absolute top-4 right-4 text-white"><Icons.X /></button>
                            {photos[viewSlot].full || photos[viewSlot].thumb
                                ? <img src={photos[viewSlot].full || photos[viewSlot].thumb} className="max-w-full max-h-[85vh] rounded shadow-2xl" onClick={e => e.stopPropagation()} />
                                : <span className="loader"></span>}
                            <div className="flex gap-4 mt-4 text-white text-sm items-center" onClick={e => e.stopPropagation()}>
                                {(() => { const idxs = photos.map((p, i) => (p.thumb || p.full) ? i : -1).filter(i => i >= 0); const pos = idxs.indexOf(viewSlot); return <>
                                    <button disabled={pos <= 0} onClick={() => setViewSlot(idxs[pos - 1])} className="px-3 py-1 rounded bg-white/10 disabled:opacity-30">‹ Anterior</button>
                                    <span>Foto {viewSlot + 1}</span>
                                    <button disabled={pos >= idxs.length - 1} onClick={() => setViewSlot(idxs[pos + 1])} className="px-3 py-1 rounded bg-white/10 disabled:opacity-30">Siguiente ›</button>
                                </>; })()}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<TransportationDashboard />);
    </script>
</body>
</html>
